[project]
name = "dart-insight-service"
version = "0.1.0"
description = "DART Insight production API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "authlib>=1.6,<2",
    "httpx>=0.28,<1",
    "itsdangerous>=2.2,<3",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.20,<1",
    "pypdf>=6,<7",
    "openai>=1.99,<3",
    "reportlab>=4.2,<5",
    "Pillow>=11,<13",
    "langgraph>=1,<2",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
